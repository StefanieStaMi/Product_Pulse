  <text x="70" y="272" class="h">Leadership for</text>
  <text x="70" y="339" class="h">HRTech Startups</text>
  <text x="74" y="377" class="m">Strategy · Product · Operations · Growth</text>
  <text x="74" y="417" class="s">Stefanie Stanislawski</text>
  <text x="74" y="449" class="m">Senior product leadership for HRTech founders.</text>

  <rect x="735" y="85" width="350" height="120" rx="24" fill="#f6d667" stroke="#151515" stroke-width="2"/>
  <text x="757" y="118" class="card">PRODUCT STRATEGY</text>
  <rect x="757" y="139" width="306" height="14" rx="7" fill="#fff"/>
  <rect x="757" y="167" width="225" height="14" rx="7" fill="#fff"/>

  <rect x="785" y="185" width="350" height="120" rx="24" fill="#d7c7ff" stroke="#151515" stroke-width="2"/>
  <text x="807" y="218" class="card">PRODUCT OPS</text>
  <rect x="807" y="239" width="306" height="14" rx="7" fill="#fff"/>
