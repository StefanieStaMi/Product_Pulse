<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f5f2ec"/>
  <style>
    .brand{font:700 44px Arial,Helvetica,sans-serif;fill:#151515}
    .h{font:800 62px Arial,Helvetica,sans-serif;fill:#151515;letter-spacing:-2.8px}
    .m{font:400 21px Arial,Helvetica,sans-serif;fill:#716d66}
    .s{font:700 16px Arial,Helvetica,sans-serif;fill:#151515}
    .card{font:700 16px Arial,Helvetica,sans-serif;fill:#151515;letter-spacing:1px}
