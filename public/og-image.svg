  <rect x="710" y="285" width="350" height="120" rx="24" fill="#c8e8d8" stroke="#151515" stroke-width="2"/>
  <text x="732" y="318" class="card">AI + CX</text>
  <rect x="732" y="339" width="306" height="14" rx="7" fill="#fff"/>
  <rect x="732" y="367" width="225" height="14" rx="7" fill="#fff"/>

  <rect x="830" y="395" width="305" height="145" rx="25" fill="#151515"/>
  <text x="858" y="435" class="tag">Make the product</text>
  <text x="858" y="473" class="tag" fill="#ffd35c">work harder.</text>

  <line x1="70" y1="585" x2="1135" y2="585" stroke="#ded9d0" stroke-width="2"/>
